workflows:
  ios-horadotreino:
    name: iOS Hora do Treino
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Deve bater com o NOME dado à integração App Store Connect no Codemagic.
      app_store_connect: codemagic
    environment:
      groups:
        - signing
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependências npm
        script: npm ci
      - name: Sincronizar Capacitor (iOS)
        script: npx cap sync ios
      - name: Instalar Pods (CocoaPods)
        script: |
          cd ios/App
          pod install --repo-update
      - name: Embutir Firebase e definir número de build
        script: |
          set -e
          # 1) Coloca o arquivo de config do Firebase no lugar padrão do target.
          cp ios/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          # 2) Registra o arquivo no projeto Xcode (embute no app; sem isso o
          #    Firebase crasha na abertura) e define um número de build único.
          gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' }
          raise 'Target "App" nao encontrado' unless target

          # 2a) Embute o GoogleService-Info.plist como recurso do target.
          group = project.main_group['App']
          raise "Grupo 'App' nao encontrado. Grupos: #{project.main_group.children.map(&:display_name)}" unless group
          filename = 'GoogleService-Info.plist'
          already = target.resources_build_phase.files.any? { |bf| bf.file_ref && bf.file_ref.display_name == filename }
          unless already
            ref = group.files.find { |f| f.display_name == filename } || group.new_reference(filename)
            target.add_resources([ref])
            puts "#{filename} embutido no target App."
          end

          # 2b) Número de build único e crescente (evita 'build ja existe' no upload).
          #     Com CocoaPods não precisa de flags de linker: os plugins registram
          #     sozinhos.
          bn = Time.now.to_i.to_s
          target.build_configurations.each { |c| c.build_settings['CURRENT_PROJECT_VERSION'] = bn }
          puts "CURRENT_PROJECT_VERSION = #{bn}"

          project.save
          RUBY
      - name: Inicializar keychain
        script: keychain initialize
      - name: Buscar/criar certificado e profile de assinatura
        script: |
          echo "$CERT_KEY_B64" | base64 --decode > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "com.horadotreino.app" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
      - name: Adicionar certificado ao keychain
        script: keychain add-certificates
      - name: Aplicar profiles no projeto Xcode
        script: xcode-project use-profiles
      - name: Gerar o IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App"
      - name: DIAGNOSTICO classes de plugin no binario
        script: |
          set +e
          IPA=$(find "$PWD" -name "*.ipa" 2>/dev/null | head -1)
          echo "IPA: $IPA"
          WORK=$(mktemp -d); cd "$WORK"
          unzip -o -q "$IPA" >/dev/null 2>&1
          APP=$(ls -d Payload/*.app 2>/dev/null | head -1)
          NAME=$(basename "$APP" .app)
          echo "Binario principal: $APP/$NAME"
          echo "===== PurchasesPlugin no binario principal? ====="
          nm "$APP/$NAME" 2>/dev/null | grep -i "PurchasesPlugin" | head
          echo "===== FirebaseMessagingPlugin no binario principal? ====="
          nm "$APP/$NAME" 2>/dev/null | grep -i "FirebaseMessagingPlugin" | head
          echo "===== Frameworks embutidos ====="
          ls "$APP/Frameworks" 2>/dev/null
          echo "===== procurando PurchasesPlugin dentro dos frameworks ====="
          for f in "$APP/Frameworks"/*.framework; do
            fn=$(basename "$f" .framework)
            if nm "$f/$fn" 2>/dev/null | grep -qi "PurchasesPlugin"; then
              echo "  ACHOU PurchasesPlugin em: $fn.framework"
            fi
          done
          echo "===== FIM DIAGNOSTICO ====="
          exit 0
    artifacts:
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Só faz upload pro App Store Connect (fica disponível p/ teste interno).
        # submit_to_testflight fica desligado: envio p/ teste EXTERNO exige
        # "beta app information" e passa por revisão — fazemos isso depois, se quiser.
        submit_to_testflight: false
